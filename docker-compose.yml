services:
  olist_redis_service:
    image: redis:7-alpine
    container_name: olist_production_redis
    ports:
      - "6385:6379"
    networks:
      - olist_isolated_network
    restart: always

  backend:
    build: .
    container_name: olist_django_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8085:8000"
    env_file:
      - .env
    depends_on:
      - olist_redis_service
    networks:
      - olist_isolated_network
    restart: always

  celery_worker:
    build: .
    container_name: olist_celery_worker
    command: celery -A olist_platform worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - olist_redis_service
    networks:
      - olist_isolated_network
    restart: always

networks:
  olist_isolated_network:
    driver: bridge